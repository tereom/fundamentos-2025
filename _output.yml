bookdown::gitbook:
  toc_depth: 2                      # <–– forces only # and ##
  includes:
    in_header: html/in_header.html
    after_body: html/after_body.html
  css: [css/style.css]
  config:
    toc:
      collapse: section
      before: |
        <li><a href="./">Fundamentos de Estadística con Remuestreo</a></li>
      after: |
        <li><a href="https://github.com/tereom/fundamentos-2025" target="blank">Publicado con bookdown</a></li>
    sharing:
      github: yes
      facebook: no
      twitter: no
    download: ["pdf"]
